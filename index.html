

<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>nikki | 私の日記</title>

<style>

:root{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#292929;background:#f7f6f2}

*{box-sizing:border-box}

body{margin:0;padding:20px 16px 80px}

main{max-width:650px;margin:auto}

h1{font-family:Georgia,serif;font-size:38px;margin:12px 0 4px}

.sub{color:#777;font-size:13px;margin-bottom:28px}

section{background:white;border:1px solid #e8e5df;border-radius:16px;padding:18px;margin:16px 0}

h2{font-size:17px;margin:0 0 14px}

label{display:block;font-size:13px;color:#666;margin:14px 0 6px}

input,textarea,button{font:inherit}

input[type=date],input[type=text],textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;background:white}

textarea{min-height:190px;resize:vertical;line-height:1.7}

button,.filebtn{border:0;border-radius:9px;padding:12px 16px;background:#6c2735;color:white;cursor:pointer;display:inline-block}

button.secondary,.filebtn.secondary{background:#eee;color:#333}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

.entry{padding:13px 0;border-bottom:1px solid #eee;cursor:pointer}

.entry:last-child{border:0}

.entry small{color:#777}

.entry p{white-space:pre-wrap;margin:7px 0;line-height:1.5}

.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.photos img{width:90px;height:90px;object-fit:cover;border-radius:8px}

.empty{color:#888;font-size:14px}

#status{font-size:13px;color:#6c2735;margin-top:10px}

</style>

</head>

<body>

<main>

<h1>nikki</h1>

<div class="sub">日々の記録を、未来の自分へ。</div>

<section>

<h2>日記を書く</h2>

<label>日付</label>

<input type="date" id="date">

<label>タイトル</label>

<input type="text" id="title" placeholder="今日の出来事">

<label>本文</label>

<textarea id="body" placeholder="今日のことを記録する"></textarea>

<label>写真（複数選択できます）</label>

<input type="file" id="photos" accept="image/*" multiple>

<div class="photos" id="preview"></div>

<div class="actions">

<button onclick="saveEntry()">保存する</button>

<button class="secondary" onclick="clearForm()">入力をクリア</button>

</div>

<div id="status"></div>

</section>

<section>

<h2>あの日の今日</h2>

<div id="memories" class="empty"></div>

</section>

<section>

<h2>日記一覧</h2>

<div id="entries"></div>

</section>

<section>

<h2>バックアップ・復元</h2>

<p class="empty">記録はこの端末のブラウザ内に保存されます。定期的にバックアップしてください。</p>

<div class="actions">

<button onclick="backup()">JSONを書き出す</button>

<label class="filebtn secondary" style="margin:0">JSONから復元

<input type="file" id="restore" accept=".json,application/json" hidden>

</label>

</div>

</section>

</main>

<script>

const KEY="nikki.entries.v1";

const $=id=>document.getElementById(id);

const today=()=>{

const d=new Date();

return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");

};

let data={};

let currentPhotos=[];

try{data=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){data={}}

$("date").value=today();

function persist(){

localStorage.setItem(KEY,JSON.stringify(data));

}

function msg(s){$("status").textContent=s}

function clearForm(){

$("date").value=today();$("title").value="";$("body").value="";

currentPhotos=[];$("photos").value="";

renderPhotos();msg("");

}

function renderPhotos(){

$("preview").replaceChildren();

currentPhotos.forEach((src,i)=>{

const img=document.createElement("img");img.src=src;

img.title="タップで写真を削除";

img.onclick=()=>{

if(confirm("この写真を削除しますか？")){

currentPhotos.splice(i,1);renderPhotos();

}};

$("preview").append(img);

});

}

$("photos").onchange=async e=>{

try{

for(const file of e.target.files){

if(!file.type.startsWith("image/"))continue;

const src=await compress(file);

currentPhotos.push(src);

}

renderPhotos();msg("写真を追加しました");

}catch(err){msg("写真を読み込めませんでした")}

e.target.value="";

};

function compress(file){

return new Promise((resolve,reject)=>{

const img=new Image(),url=URL.createObjectURL(file);

img.onload=()=>{

try{

const scale=Math.min(1,1200/Math.max(img.width,img.height));

const c=document.createElement("canvas");

c.width=Math.round(img.width*scale);

c.height=Math.round(img.height*scale);

c.getContext("2d").drawImage(img,0,0,c.width,c.height);

resolve(c.toDataURL("image/jpeg",0.7));

}catch(e){reject(e)}

finally{URL.revokeObjectURL(url)}

};

img.onerror=()=>{URL.revokeObjectURL(url);reject(Error("image"))};

img.src=url;

});

}

function saveEntry(){

const date=$("date").value;

if(!date){msg("日付を選択してください");return}

const entry={

id:date,date,

title:$("title").value,

body:$("body").value,

photos:[...currentPhotos],

updatedAt:new Date().toISOString()

};

const previous=data[date];

data[date]=entry;

try{

persist();msg("保存しました");render();

}catch(e){

if(previous)data[date]=previous;else delete data[date];

msg("保存容量が不足しています。バックアップを取ってください");

}

}

function openEntry(date){

const e=data[date];if(!e)return;

$("date").value=e.date;

$("title").value=e.title||"";

$("body").value=e.body||"";

currentPhotos=[...(e.photos||[])];

renderPhotos();msg("過去の日記を編集中です");

window.scrollTo({top:0,behavior:"smooth"});

}

function makeEntry(e){

const div=document.createElement("div");div.className="entry";

const date=document.createElement("small");date.textContent=e.date;

const title=document.createElement("strong");

title.textContent=" "+(e.title||"無題");

const p=document.createElement("p");

p.textContent=(e.body||"").slice(0,110);

div.append(date,title,p);

if(e.photos?.length){

const small=document.createElement("small");

small.textContent="写真 "+e.photos.length+"枚";

div.append(small);

}

div.onclick=()=>openEntry(e.date);

return div;

}

function render(){

const list=$("entries"),mem=$("memories");

list.replaceChildren();mem.replaceChildren();

const entries=Object.values(data).sort((a,b)=>b.date.localeCompare(a.date));

if(!entries.length)list.textContent="まだ日記がありません";

entries.forEach(e=>list.append(makeEntry(e)));

let count=0;

for(const years of [1,3]){

const d=new Date($("date").value+"T12:00:00");

d.setFullYear(d.getFullYear()-years);

const key=[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");

if(data[key]){

const h=document.createElement("h3");

h.textContent=years+"年前の今日";

mem.append(h,makeEntry(data[key]));count++;

}

}

if(!count)mem.textContent="この日の過去の日記はまだありません";

}

$("date").onchange=render;

function backup(){

const blob=new Blob([JSON.stringify({app:"nikki",version:1,entries:data},null,2)],{type:"application/json"});

const url=URL.createObjectURL(blob);

const a=document.createElement("a");a.href=url;

a.download="nikki-backup-"+today()+".json";

a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);

}

$("restore").onchange=async e=>{

const file=e.target.files[0];if(!file)return;

try{

const obj=JSON.parse(await file.text());

if(obj.app!=="nikki"||obj.version!==1||!obj.entries||Array.isArray(obj.entries)||typeof obj.entries!=="object")throw Error("format");

if(!confirm("現在の日記をバックアップの内容で置き換えますか？"))return;

const old=data;data=obj.entries;

try{persist();clearForm();render();msg("復元しました")}

catch(err){data=old;msg("復元に失敗しました。保存容量をご確認ください")}

}catch(err){msg("対応していないバックアップファイルです")}

e.target.value="";

};

render();

</script>

</body>

</html>
